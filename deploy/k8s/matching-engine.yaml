apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  namespace: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-engine
  template:
    metadata:
      labels:
        app: matching-engine
    spec:
      containers:
        - name: matching-engine
          image: ledger-matching-engine:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
            - name: REDIS_ADDR
              value: redis:6379
