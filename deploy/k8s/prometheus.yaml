# Prometheus scrape config (same targets as deploy/prometheus.yml).
# Service DNS works inside namespace `ledger`: order-api, matching-engine, settlement-worker.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ledger
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: order-api
        static_configs:
          - targets: ["order-api:8080"]

      - job_name: matching-engine
        static_configs:
          - targets: ["matching-engine:2112"]

      - job_name: settlement-worker
        static_configs:
          - targets: ["settlement-worker:2112"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ledger
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
