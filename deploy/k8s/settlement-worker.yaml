apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-worker
  namespace: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlement-worker
  template:
    metadata:
      labels:
        app: settlement-worker
    spec:
      containers:
        - name: settlement-worker
          image: ledger-settlement-worker:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2112
          env:
            - name: DATABASE_URL
              value: postgres://ledger:ledger@postgres:5432/ledger?sslmode=disable
            - name: REDIS_ADDR
              value: redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-worker
  namespace: ledger
spec:
  selector:
    app: settlement-worker
  ports:
    - name: metrics
      port: 2112
      targetPort: 2112
